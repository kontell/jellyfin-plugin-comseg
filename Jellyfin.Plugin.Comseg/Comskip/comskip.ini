; Comseg's default Comskip settings. Copy this file, edit it, and point the
; plugin's "Comskip ini" setting at the copy to change anything; the plugin
; appends its own run-mode keys (live_tv, output_edl, thread_count, ...) and
; those always win.
;
; Values not listed here are Comskip's built-in defaults.

; 1=black frame, 2=logo, 4=scene change, 8=resolution change, 16=closed
; captions, 32=aspect ratio, 64=silence. Everything but scene change.
detect_method=123

; Ignore the bottom 15% of the picture when looking for the station logo: 162
; lines at 1080p, 324 at 2160p. Score bugs and provider watermarks live there:
; a watermark that is on screen through the ads is taken for the logo, found on
; 99% of frames, and logo detection switches itself off, which on a feed with no
; black frames between spots leaves nothing to detect with. A count of lines
; would cover the watermark only at the resolution it was set for.
ticker_tape_percentage=15

; Breaks shorter than this (seconds) are not breaks. Sports feeds need it low.
min_commercialbreak=20
; Longest break (seconds); a studio halftime show is programme, not a break.
max_commercialbreak=600
; Longest single spot (seconds).
max_commercial_size=120
; Any segment longer than this (seconds) scores as programme.
min_show_segment_length=120

; Keep the EDL simple: cut type 0, no padding, no offset.
edl_skip_field=0
padding=0
edl_offset=0

; Quiet. The plugin reads the .edl files, not the log.
verbose=0
