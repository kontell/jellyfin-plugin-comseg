name: "Comseg"
guid: "96262b59-95a6-4283-913c-e20e0967b35c"
# The supported Jellyfin line (.github/workflows/abis.yml has the same row); a
# bare `tools/package.sh` produces this.
#
# version tracks the Jellyfin ABI it is built against: <server major.minor>.0.<build>.
# The authority is the csproj's PluginVersion; this value is documentation and
# is asserted against it at release time.
version: "12.0.0.2"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "kontell"
overview: "Commercial segments for DVR recordings, detected with Comskip"
description: "Runs Comskip against DVR recordings, while they record and once they finish, and stores the breaks as Jellyfin Commercial media segments for any client that skips them."
category: "General"
image: "logo.png"
imageUrl: "https://raw.githubusercontent.com/kontell/jellyfin-plugin-comseg/main/logo.png"
artifacts:
  - "Jellyfin.Plugin.Comseg.dll"
changelog: |-
  - The live breaks stay in place while the final pass runs: when Jellyfin
    clears a recording's segments as the file closes, Comseg puts them
    straight back.
  - A final pass that never stored its result (a restart, a timeout) is run
    again by the Media Segment Scan.
  - Only Comseg's own Commercial rows are read or changed; rows from other
    providers are left alone.
  - Recordings in a library that disables the provider are not analysed.
  - The built-in ini ignores the bottom 15% of the picture rather than 160
    lines, which keeps the provider watermark out of the logo search on UHD
    feeds too.
  - Check Comskip says which ini runs use, and the extra recording folders
    are a plain text field.
