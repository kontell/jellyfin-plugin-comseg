# The supported Jellyfin line (.github/workflows/abis.yml has the same row); a
# bare `tools/package.sh` produces this.
#
# version tracks the Jellyfin ABI it is built against: <server major.minor>.0.<build>.
# The authority is the csproj's PluginVersion; this value is documentation and
# is asserted against it at release time.
version: "12.0.0.1"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "kontell"
overview: "Commercial segments for DVR recordings, detected with Comskip"
description: "Runs Comskip against DVR recordings, while they record and once they finish, and stores the breaks as Jellyfin Commercial media segments for any client that skips them."
category: "General"
image: "logo.png"
imageUrl: "https://raw.githubusercontent.com/kontell/jellyfin-plugin-comseg/main/logo.png"
artifacts:
  - "Jellyfin.Plugin.Comseg.dll"
changelog: |-
  - First release: live detection on recordings in progress (patched Comskip),
    full pass on finished recordings, Commercial media segments.
